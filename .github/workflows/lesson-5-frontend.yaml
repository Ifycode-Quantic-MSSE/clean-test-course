name: Lesson 5 DAST

on:
  push:
    branches:
      - lesson-5
jobs:
  function_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - name: Run functional tests
        run: npm test -- --coverage --watchAll=false
  deploy:
    needs: [function_test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: npm install && npm run build
      - name: Generate deployment package
        run: zip -r deploy.zip build Dockerfile
      - name: '**PLACEHOLDER** Deploy to Elastic Beanstalk'
        run: echo Placeholder for Deployment
  security_test:
    needs: [deploy]
    runs-on: ubuntu-latest
    # 1. Give ZAP the needed permissions
    permissions:
      contents: read
      issues: write  # This allows ZAP to create the report issue
    steps:
      # 1. You must checkout the repo so a workspace directory exists
      - name: Checkout
        uses: actions/checkout@v4
      # 2. You must open up permissions so the Docker container can write to that directory
      - name: chmod
        run: sudo chmod -R 777 .
      # 3. Finally add the security scan
      - name: Dynamic Application Security Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://hangryhippo.quantic.host'
          token: ${{ secrets.GITHUB_TOKEN }}
